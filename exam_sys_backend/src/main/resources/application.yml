server:
  port: 8080

spring:
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    # Redis缓存配置
  data:
    redis:
      host: localhost  # Redis服务器地址
      port: 6379       # Redis服务器端口
      database: 0      # 使用的数据库索引
      timeout: 10000   # 连接超时时间（毫秒）
      lettuce:
        pool:
          max-active: 8   # 连接池最大连接数
          max-wait: -1    # 连接池最大阻塞等待时间（使用负值表示没有限制）
          max-idle: 8     # 连接池中的最大空闲连接
          min-idle: 0     # 连接池中的最小空闲连接
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: jdbc:mysql://localhost:3306/exam_sys?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2b8
    username: root
    password: root
    hikari:
      connection-test-query: SELECT 1 # 自动检测连接
      connection-timeout: 60000 #数据库连接超时时间,默认30秒
      idle-timeout: 500000 #空闲连接存活最大时间，默认600000（10分钟）
      max-lifetime: 540000 #此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认1800000即30分钟
      maximum-pool-size: 12 #连接池最大连接数，默认是10
      minimum-idle: 10 #最小空闲连接数量
      pool-name: SPHHikariPool # 连接池名称
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

#用于打印框架生成的sql语句，便于调试
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
#  global-config:
#    db-config:
#      logic-delete-field: isDeleted
minio:
  access-key: minioadmin
  secret-key: minioadmin123
  endpoint: http://localhost:9000
  bucket-name: exam0625


deepseek:
  api:
    base-url: https://api.deepseek.com
    api-key:   # 从环境变量获取，或使用默认值
    model: deepseek-v4-flash  # 使用8k上下文模型进行判卷
    max-tokens: 2000  # 最大生成token数
    temperature: 0.3  # 较低的temperature确保判卷结果稳定